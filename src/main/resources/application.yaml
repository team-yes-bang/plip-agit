spring:
  application:
    name: agit # Eureka 등록명 — 소문자·하이픈
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/plip_agit?replicaSet=rs0}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

agit:
  mongo:
    backfill: ${AGIT_MONGO_BACKFILL:false}

plip:
  aws:
    enabled: ${AWS_ENABLED:false}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-ttl-seconds: ${AWS_PRESIGNED_URL_TTL_SECONDS:10800}
    s3:
      raw-bucket: ${AWS_S3_RAW_BUCKET:}
      image-prefix: images/
      agit-thumbnail-prefix: agit/
      cdn-base-url: ${AWS_CDN_BASE_URL:}

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    enabled: true # 공통(dev 등) 기본 연동. local/docker 프로필에서 false
    register-with-eureka: true
    fetch-registry: true
