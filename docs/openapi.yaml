openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Agit
  description: 아지트 API
paths:
  /api/v1/agits:
    post:
      tags:
      - Agit
      summary: 아지트 생성
      description: 아지트와 방장 프로필을 함께 생성하고 초대 코드를 발급합니다.
      operationId: createAgit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgitRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateAgitResponse"
  /api/test:
    get:
      tags:
      - test-controller
      operationId: test
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/test/ping:
    get:
      tags:
      - test-controller
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    CreateAgitRequest:
      type: object
      description: 아지트 생성 요청
      properties:
        agitName:
          type: string
          description: "아지트 제목 (필수, 최대 20자)"
          example: 주말 보드게임
        description:
          type: string
          description: "소개글 (선택, 최대 100자)"
          example: 가볍게 즐겨요
        maximumCapacity:
          type: integer
          format: int32
          description: "최대 인원 (필수, 기본 허용 상한 5)"
          example: 5
        thumbnailPath:
          type: string
          description: "섬네일 경로 (선택, 최대 255자)"
          example: agits/thumbnails/sample.png
        userUuid:
          type: string
          format: uuid
          description: "방장 사용자 UUID (UUIDv7, 임시 body 전달 — 추후 인증에서 추출)"
          example: 018f3f6e-8e2a-7b3c-9d4e-5f6a7b8c9d0e
        nickname:
          type: string
          description: "방장 닉네임 (필수, 영문·숫자·한글 2~12자, 특수문자·공백 불가)"
          example: 보드왕
        profileImagePath:
          type: string
          description: 방장 프로필 이미지 경로 (선택)
          example: profiles/host.png
    CreateAgitResponse:
      type: object
      description: 아지트 생성 응답
      properties:
        agitUuid:
          type: string
          format: uuid
          description: 아지트 UUID
          example: 018f3f6e-8e2a-7b3c-9d4e-5f6a7b8c9d0e
        agitName:
          type: string
          description: 아지트 제목
          example: 주말 보드게임
        description:
          type: string
          description: 소개글
          example: 가볍게 즐겨요
        maximumCapacity:
          type: integer
          format: int32
          description: 최대 인원
          example: 5
        code:
          type: string
          description: 초대 코드
          example: AB12CD
        thumbnailPath:
          type: string
          description: 섬네일 경로
          example: agits/thumbnails/sample.png
        ampId:
          type: integer
          format: int64
          description: 방장 프로필 ID (amp_id)
          example: 1
        nickname:
          type: string
          description: 방장 닉네임
          example: 보드왕
        profileImagePath:
          type: string
          description: 방장 프로필 이미지 경로
          example: profiles/host.png
        role:
          type: string
          description: 방장 역할
          enum:
          - HOST
          - GUEST
          example: HOST
