openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Agit
  description: 아지트 API
- name: Agit Mute
  description: 아지트 내 유저 뮤트 API
paths:
  /api/v1/agits:
    post:
      tags:
      - Agit
      summary: 아지트 생성
      description: 아지트와 방장 프로필을 함께 생성하고 초대 코드를 발급합니다. 액터는 Access JWT에서 추출합니다.
      operationId: createAgit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgitRequest"
        required: true
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateAgitResponse"
  /api/v1/agits/{code}/join:
    post:
      tags:
      - Agit
      summary: 아지트 입장
      description: "초대 코드로 아지트에 입장합니다. 신규는 GUEST 프로필을 생성하고, LEFT는 닉네임·이미지를 갱신한 뒤 ACTIVE로\
        \ 전환합니다. 이미 ACTIVE면 409, BANNED면 403, 정원 초과면 409를 반환합니다. 액터는 Access JWT에서\
        \ 추출합니다."
      operationId: joinAgit
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinAgitRequest"
        required: true
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JoinAgitResponse"
  /api/v1/agits/{agitUuid}/mutes/{mutedUuid}:
    post:
      tags:
      - Agit Mute
      summary: 아지트 내 유저 뮤트
      description: 해당 아지트의 ACTIVE 멤버가 다른 ACTIVE 멤버를 뮤트합니다. 이미 뮤트된 경우 변경 없이 성공합니다.
        액터는 Access JWT에서 추출합니다.
      operationId: muteMember
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: mutedUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: No Content
    delete:
      tags:
      - Agit Mute
      summary: 아지트 내 유저 뮤트 해제
      description: 본인이 건 뮤트를 해제합니다. 뮤트 관계가 없으면 변경 없이 성공합니다. 액터는 Access JWT에서 추출합니다.
      operationId: unmuteMember
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: mutedUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: No Content
  /api/v1/agits/{agitUuid}/members/{userUuid}/unban:
    post:
      tags:
      - Agit
      summary: 아지트 밴 해제
      description: 아지트장이 userUuid 기준으로 밴을 해제합니다. BANNED인 멤버는 status를 LEFT로 바꾸고 bans
        이력에 해제 시각을 기록합니다. 이미 LEFT인 경우 변경 없이 성공합니다. 액터는 Access JWT에서 추출합니다.
      operationId: unbanMember
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: No Content
  /api/v1/agits/{agitUuid}/members/{ampId}/transfer-host:
    post:
      tags:
      - Agit
      summary: 아지트장 위임
      description: 아지트장이 ampId의 ACTIVE 게스트에게 방장 권한을 위임합니다. 성공 시 204를 반환합니다. 액터는 Access
        JWT에서 추출합니다.
      operationId: transferHost
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ampId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: No Content
  /api/v1/agits/{agitUuid}/members/{ampId}/ban:
    post:
      tags:
      - Agit
      summary: 아지트에서 내보내기
      description: 아지트장이 ampId로 멤버를 내보냅니다. status를 BANNED로 바꾸고 bans 이력을 남깁니다. ACTIVE
        HOST는 내보낼 수 없습니다. 이미 BANNED인 경우 변경 없이 성공합니다. 액터는 Access JWT에서 추출합니다.
      operationId: banMember
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ampId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: No Content
  /api/v1/agits/{agitUuid}/leave:
    post:
      tags:
      - Agit
      summary: 아지트 나가기
      description: "본인이 아지트에서 나갑니다. GUEST는 status를 LEFT로 변경합니다. HOST는 ACTIVE 인원이 본\
        인뿐일 때만 나갈 수 있으며, 이때 아지트는 소프트 삭제됩니다. 이미 LEFT이거나 BANNED인 경우 변경 없이 성공합니다. 액터는\
        \ Access JWT에서 추출합니다."
      operationId: leaveAgit
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: No Content
  /api/v1/agits/{agitUuid}/invite-code:
    post:
      tags:
      - Agit
      summary: 초대 코드 재발급
      description: 아지트장이 초대 코드를 재발급합니다. 호출마다 새 코드를 반환합니다. 연타 방지는 FE에서 처리합니다. 액터는 Access
        JWT에서 추출합니다.
      operationId: reissueInviteCode
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReissueInviteCodeResponse"
  /api/v1/agits/{agitUuid}:
    get:
      tags:
      - Agit
      summary: 아지트 상세 조회
      description: "ACTIVE 멤버가 아지트 상세(메타·멤버·묶인 토픽·초대 코드)를 조회합니다. Mongo 읽기 모델을 우선하고\
        , 없으면 MySQL에서 읽기 모델을 채운 뒤 반환합니다. 액터는 Access JWT에서 추출합니다."
      operationId: getAgit
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgitDetailResponse"
    patch:
      tags:
      - Agit
      summary: 아지트 정보 변경
      description: "아지트장이 제목·인원·소개글·섬네일을 수정합니다. 변경 인원수는 현재 ACTIVE 인원보다 작을 수 없으며, 그\
        \ 외 검증은 생성과 동일합니다. 액터는 Access JWT에서 추출합니다."
      operationId: updateAgit
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgitRequest"
        required: true
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UpdateAgitResponse"
  /api/v1/agits/{agitUuid}/members/me:
    patch:
      tags:
      - Agit
      summary: 내 아지트 프로필 수정
      description: 접속 유저가 해당 아지트에서 ACTIVE인 본인 닉네임·프로필 이미지를 부분 수정합니다. 미전달 필드는 유지합니다.
        액터는 Access JWT에서 추출합니다.
      operationId: updateMyMemberProfile
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyMemberProfileRequest"
        required: true
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UpdateMyMemberProfileResponse"
  /api/v1/agits/{code}/landing:
    get:
      tags:
      - Agit
      summary: 아지트 랜딩 조회
      description: 초대 코드로 ACTIVE 아지트의 랜딩 표시 정보를 조회합니다. 인증 없이 호출 가능합니다.
      operationId: getLandingByCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgitLandingResponse"
      security: []
  /api/v1/agits/{agitUuid}/mutes:
    get:
      tags:
      - Agit Mute
      summary: 내 뮤트 목록 조회
      description: 해당 아지트에서 내가 뮤트한 사용자 UUID 목록을 반환합니다. 액터는 Access JWT에서 추출합니다.
      operationId: listMyMutes
      parameters:
      - name: agitUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MuteItemResponse"
  /api/v1/agits/me:
    get:
      tags:
      - Agit
      summary: 내 아지트 목록 조회
      description: "접속 유저가 ACTIVE로 속한 아지트 목록(제목·UUID)을 반환합니다. Mongo 읽기 문서를 조회하며, 정\
        렬은 updatedAt 내림차순(임시)입니다. 이후 최근 토픽순으로 교체 예정입니다. 액터는 Access JWT에서 추출합니다."
      operationId: listMyAgits
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyAgitItemResponse"
  /api/test:
    get:
      tags:
      - test-controller
      operationId: test
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/test/ping:
    get:
      tags:
      - test-controller
      operationId: ping
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    ErrorResponse:
      type: object
      description: 에러 응답
      properties:
        code:
          type: string
          description: 에러 코드
          example: ALREADY_JOINED
        message:
          type: string
          description: 에러 메시지
          example: 이미 참여 중인 아지트입니다.
        ampId:
          type: integer
          format: int64
          description: 이미 가입된 멤버 프로필 ID (해당 시)
          example: 1
    CreateAgitRequest:
      type: object
      description: 아지트 생성 요청
      properties:
        agitName:
          type: string
          description: "아지트 제목 (필수, 최대 20자)"
          example: 주말 보드게임
        description:
          type: string
          description: "소개글 (선택, 최대 100자)"
          example: 가볍게 즐겨요
        maximumCapacity:
          type: integer
          format: int32
          description: "최대 인원 (필수, 기본 허용 상한 5)"
          example: 5
        thumbnailPath:
          type: string
          description: "섬네일 경로 (선택, 최대 255자)"
          example: agits/thumbnails/sample.png
        nickname:
          type: string
          description: "방장 닉네임 (필수, 영문·숫자·한글 2~12자, 특수문자·공백 불가)"
          example: 보드왕
        profileImagePath:
